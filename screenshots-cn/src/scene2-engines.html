<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(160deg,#b2622d 0%,#c67139 45%,#d67f48 100%);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;
  }
  .caption{text-align:center;color:#fff;padding:6.5vh 8vw 0;flex:0 0 auto;}
  .caption h1{font-size:6.4vw;font-weight:800;line-height:1.18;letter-spacing:-0.01em;text-shadow:0 2px 10px rgba(0,0,0,.12);}
  .caption p{font-size:3.2vw;font-weight:500;margin-top:2.4vh;color:rgba(255,255,255,.92);line-height:1.5;}
  .stage{flex:1 1 auto;display:flex;align-items:flex-end;justify-content:center;width:100%;}
  .phone{
    width:80%;height:88%;background:#fff;
    border-radius:9% 9% 0 0 / 4.2% 4.2% 0 0;
    box-shadow:0 -8px 60px rgba(0,0,0,.28);
    border:1.1vw solid #1a1a1a;border-bottom:none;
    overflow:hidden;display:flex;flex-direction:column;
  }
  /* Organic palette (design/handoff.md §1) — mirrors the real popup. */
  .pop{--accent:#c67139;--sage:#728157;--sage-light:#e1eecc;--sage-deep:#272e1b;--text:#201e1d;
    --text-secondary:#82796a;--border:#dcd3c4;--section-bg:#f9f4ed;
    flex:1;display:flex;flex-direction:column;background:#f5ead8;}
  .phead{display:flex;align-items:center;gap:2.6%;padding:4vh 5.5% 3.4vh;}
  .logo{flex-shrink:0;width:11vw;height:11vw;display:flex;align-items:center;justify-content:center;}
  .logo svg{width:11vw;height:11vw;}
  .phead h1{font-size:4.4vw;font-weight:600;color:var(--text);flex:1;}
  .badge{font-size:2.7vw;font-weight:700;padding:0.9vh 3vw;border-radius:99vw;background:var(--sage-light);color:var(--sage-deep);}
  .section{background:#fff;margin:0 4.5% 1.6vh;padding:0.6vh 4%;border-radius:4vw;box-shadow:0 1px 2px rgba(46,43,37,.14);}
  .row{display:flex;align-items:center;justify-content:space-between;min-height:6.2vh;gap:4%;}
  .row-label{font-size:3.5vw;color:var(--text);flex-shrink:0;}
  .select{font-size:3.4vw;color:var(--text);background:var(--section-bg);border:1px solid var(--border);border-radius:99vw;padding:1.2vh 3.6vw;display:flex;align-items:center;gap:2vw;}
  .select.active{border-color:var(--accent);color:#8c491a;font-weight:600;background:#fff;box-shadow:0 0 0 3px rgba(198,113,57,.14);}
  .caret{font-size:2.6vw;opacity:.6;}
  /* open dropdown */
  .menu-wrap{padding:0 4.5% 1.6vh;}
  .menu-label{font-size:3.1vw;color:var(--text-secondary);margin:1.6vh 0 1.1vh;font-weight:500;}
  .menu{background:#fff;border:1px solid var(--border);border-radius:4vw;overflow:hidden;box-shadow:0 8px 26px rgba(46,43,37,.1);}
  .opt{display:flex;align-items:center;gap:3vw;padding:2.15vh 4.5vw;font-size:3.5vw;color:var(--text);border-bottom:1px solid #eee7db;}
  .opt:last-child{border-bottom:none;}
  .opt .dot{width:2.6vw;height:2.6vw;border-radius:50%;background:var(--sage);flex-shrink:0;}
  .opt.sel{background:var(--sage-light);font-weight:600;color:var(--sage-deep);}
  .opt.sel .check{margin-left:auto;color:#56633f;font-size:3.8vw;font-weight:700;}
  .opt .sub{margin-left:auto;font-size:2.7vw;color:var(--text-secondary);}
  .actions{padding:2.6vh 4.5% 3vh;margin-top:auto;}
  .btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:99vw;padding:2.4vh 0;font-size:4vw;font-weight:700;text-align:center;box-shadow:0 4px 16px rgba(198,113,57,.28);}
</style>
</head>
<body>
  <div class="caption">
    <h1>多种国内大模型引擎</h1>
    <p>DeepSeek · 智谱GLM · 通义千问 · Kimi，也可自定义接口</p>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="pop">
        <div class="phead">
          <div class="logo">
            <img src="../../extension/icons/icon.svg" style="width:11vw;height:11vw" alt="">
          </div>
          <h1>大肚猴翻译</h1>
          <span class="badge">已开启</span>
        </div>
        <div class="section">
          <div class="row"><span class="row-label">目标语言</span><span class="select">简体中文 <span class="caret">▾</span></span></div>
        </div>
        <div class="section" style="border-bottom:none;">
          <div class="row"><span class="row-label">翻译引擎</span><span class="select active">智谱 GLM <span class="caret">▴</span></span></div>
        </div>
        <div class="menu-wrap">
          <div class="menu">
            <div class="opt"><span class="dot"></span>DeepSeek</div>
            <div class="opt sel"><span class="dot" style="background:#56633f;"></span>智谱 GLM<span class="check">✓</span></div>
            <div class="opt"><span class="dot"></span>通义千问</div>
            <div class="opt"><span class="dot"></span>Kimi</div>
            <div class="opt"><span class="dot" style="background:#9aa0a6;"></span>自定义接口<span class="sub">Chat / Messages</span></div>
          </div>
        </div>
        <div class="actions"><div class="btn">翻译本页</div></div>
      </div>
    </div>
  </div>
</body>
</html>
