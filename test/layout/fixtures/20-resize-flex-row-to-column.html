<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>flex row that a media query flips to a column</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; }
  .row { display: flex; flex-wrap: nowrap; gap: 12px; padding: 20px; align-items: baseline; }
  /* The responsive flip: at narrow widths the row becomes a column, which makes
     the renderer's row fix (flex-wrap:wrap on the parent + flex-basis:100% on the
     translation) not just useless but wrong — in a column, basis is HEIGHT. */
  @media (max-width: 700px) {
    .row { flex-direction: column; align-items: stretch; }
  }
</style>
<body>
<div class="row">
  <div>Nearly five thousand people liked this video.</div>
  <div>Around 290 thousand views so far.</div>
  <div>Uploaded about one year ago.</div>
</div>
<script type="application/json" id="mt-expect">
{
  "name": "resize-flex-row-to-column",
  "unitCount": 3,
  "mutations": [
    {
      "sel": ".row",
      "prop": "flexWrap",
      "to": "wrap",
      "marker": "data-mt-flow-fix"
    }
  ],
  "targets": [
    {
      "sel": ".row > div:not(.mt-translation)",
      "assert": [
        "ownRow",
        "fullRowWidth:6",
        "noOverlapWithSiblings"
      ]
    }
  ],
  "resize": {
    "width": 640,
    "height": 900
  },
  "resizeManifest": {
    "mutations": [],
    "targets": [
      {
        "sel": ".row > div:not(.mt-translation)",
        "assert": [
          "parentNotMutated",
          "flexBasisAuto",
          "sameLeft:2",
          "noOverlapWithSiblings"
        ]
      }
    ]
  }
}
</script>
</body>
</html>
