<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Translator</title>
  <link rel="stylesheet" href="../styles/organic-tokens.gen.css">
  <link rel="stylesheet" href="popup.css">
  <!-- 设备类别要在**首帧之前**定下来，否则桌面上会先闪一下手机版式。
       判据在 content/device.js（分层的理由写在那里）。它自己就会 apply ——
       **不要在这里写内联脚本去调**：Firefox 的扩展 CSP 会拦掉，
       表现是桌面版式在 Firefox 上静默失效。 -->
  <script src="../content/device.js"></script>
</head>
<body>
  <!-- React 挂载点（popup.jsx，PR3 起自此渲染全部内容；id/结构/注释搬进
       src/pages/popup.jsx）。原静态 body 的一帧只承担「JS 到达前别空白」，
       现在由 bundle 一次画齐 —— 首帧语言直接取 uiLang 生效值，不再先中文兜底再换。 -->
  <div id="root"></div>

  <script src="../learn/page-settings.js"></script>

  <script src="../content/i18n-messages.js"></script>
  <script src="../content/providers.gen.js"></script>
  <script src="../content/stt.gen.js"></script>   <!-- 转写引擎注册表：判「有没有实时接口」（中国版生成物无品牌词） -->
  <script src="../content/engine-state.js"></script>
  <script src="../content/stt-state.js"></script>
  <script src="asr-entry.js"></script>
  <script src="../content/wire-format.js"></script>
  <script src="../learn/grant.js"></script>   <!-- 免费额度那一行（§8.10）。弹窗只用它的 popupRow/status，不发任何请求 -->
  <script src="../content/learn-model.js"></script>
  <script src="../content/learn-rules.js"></script>
  <script src="../content/learn-scheduler.js"></script>
  <script src="../learn/store.js"></script>
  <script src="../learn/drain.js"></script>
  <!-- 同步四件套。**2026-09-01 推翻了「弹窗不加载 auth.js」那条决定**（理由写在
       popup.js 的心跳那段）：那条决定的前提是「别的面会推」，而探查证明没有别的面
       会推 —— 全仓只有复习页和设置页两个入口级触发点，只翻译、不开那两页的人，
       服务器上永远是空的，App 里就永远没卡。
       顺序照复习页：backend.config → auth → chunk → sync。 -->
  <script src="../learn/backend.config.js"></script>
  <script src="../learn/auth.js"></script>
  <script src="../learn/chunk.js"></script>
  <script src="../learn/sync.js"></script>
  <script src="../learn/app-link.js"></script>
  <script src="../learn/feedback.js"></script>
  <script src="../learn/telemetry.js"></script>
  <script src="popup.js"></script>
</body>
</html>
