<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" fill="#0a7a3c"/>
      </svg>
    </div>
    <h1>大肚猴翻译</h1>
    <div class="badge" id="status-badge">已关闭</div>
  </div>

  <div class="section">
    <div class="row toggle-row">
      <span class="row-label">启用翻译</span>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <span class="row-label">目标语言</span>
      <select id="target-lang" class="select">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ar">العربية</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="row">
      <span class="row-label">翻译引擎</span>
      <select id="provider" class="select">
        <option value="google">Google 翻译（免费）</option>
        <option value="openai">ChatGPT (OpenAI)</option>
        <option value="claude">Claude (Anthropic)</option>
        <option value="deepseek">DeepSeek</option>
        <option value="glm">智谱 GLM</option>
      </select>
    </div>
  </div>

  <div class="section" id="apikey-section" style="display:none">
    <div class="row col">
      <span class="row-label">API Key</span>
      <div class="api-key-wrap">
        <input type="password" id="api-key" class="input" placeholder="输入 API Key…" autocomplete="off">
        <button class="eye-btn" id="toggle-eye" aria-label="显示/隐藏">
          <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="row col" id="baseurl-row" style="display:none">
      <span class="row-label">自定义 API 地址 <span class="hint">（可选）</span></span>
      <input type="text" id="api-base-url" class="input" placeholder="https://api.openai.com">
    </div>
  </div>

  <div class="section actions">
    <button class="btn-primary" id="btn-translate">翻译本页</button>
    <button class="btn-secondary" id="btn-settings">更多设置</button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
