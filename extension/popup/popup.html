<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Translator</title>
  <link rel="stylesheet" href="../styles/organic-tokens.gen.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="logo">
      <!-- 大肚猴 mark — the canonical icons/icon.svg, referenced not restated
           (design/handoff.md §3; same-package URLs work in extension pages). -->
      <img src="../icons/icon.svg" width="36" height="36" alt="">
    </div>
    <h1 data-i18n="extension_name">大肚猴翻译</h1>
    <div class="badge" id="status-badge" data-i18n="popup_status_off">已关闭</div>
  </div>

  <!-- Onboarding: says what to do BEFORE the user hits a bad first result.
       Filled and shown/hidden by popup.js — never both states at once. -->
  <div class="setup-note" id="setup-note" style="display:none"></div>

  <!-- 复习入口。到期为 0 时这一行仍然显示（只是没有计数）—— 藏起来会让整个功能
       无从发现。计数不用 action badge：service worker 在 Safari iOS 上会死，
       badge 会静默过期。 -->
  <div class="section">
    <button class="row row-btn" id="open-review">
      <span class="row-label" data-i18n="learn_review">复习</span>
      <span class="row-value" id="review-count"></span>
    </button>
  </div>

  <!-- 本站（interaction-spec「来源治理」）：页内快速入口刻意放在弹窗里 ——
       采集对浏览流必须零打扰。被规则挡住的页面在这里可见、可修复（法则 2）。
       只在「采集学习材料」开着且页面可注入时显示。 -->
  <div class="section" id="site-section" hidden>
    <div class="row">
      <span class="row-label"><span data-i18n="popup_site_capture">收录本站</span><br><span class="hint" id="site-host"></span></span>
      <label class="switch" id="site-switch">
        <input type="checkbox" id="site-capture">
        <span class="slider"></span>
      </label>
    </div>
    <button class="row row-btn" id="site-blocked-row" hidden>
      <span class="row-label hint" id="site-blocked-by"></span>
      <span class="row-value" data-i18n="popup_site_manage">管理…</span>
    </button>
  </div>

  <div class="section">
    <div class="row">
      <span class="row-label" data-i18n="popup_target_lang">目标语言</span>
      <select id="target-lang" class="select">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ar">العربية</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="row">
      <span class="row-label" data-i18n="ui_lang_label">界面语言</span>
      <select id="ui-lang" class="select">
        <option value="auto" data-i18n="ui_lang_auto">跟随系统</option>
        <option value="zh_CN">简体中文</option>
        <option value="zh_TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ar">العربية</option>
        <option value="pt_BR">Português</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="row">
      <span class="row-label" data-i18n="popup_provider">翻译引擎</span>
      <select id="provider" class="select"><!-- populated from window.MT_PROVIDERS by popup.js --></select>
    </div>
  </div>

  <div class="section" id="apikey-section" style="display:none">
    <div class="row col">
      <span class="row-label">API Key</span>
      <div class="api-key-wrap">
        <input type="password" id="api-key" class="input" placeholder="输入 API Key…" data-i18n-placeholder="placeholder_api_key" autocomplete="off">
        <button class="eye-btn" id="toggle-eye" aria-label="显示/隐藏" data-i18n-aria="toggle_show_hide">
          <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="row col" id="baseurl-row" style="display:none">
      <span class="row-label"><span data-i18n="label_custom_api">自定义 API 地址</span> <span class="hint" data-i18n="label_optional">（可选）</span></span>
      <input type="text" id="api-base-url" class="input" placeholder="https://…">
    </div>
    <div class="row col" id="model-row" style="display:none">
      <span class="row-label"><span data-i18n="label_custom_model">模型</span> <span class="hint" data-i18n="label_optional">（可选）</span></span>
      <input type="text" id="api-model" class="input" placeholder="" autocomplete="off">
    </div>
  </div>

  <div class="section actions">
    <button class="btn-primary" id="btn-translate" data-i18n="btn_translate_page">翻译本页</button>
    <button class="btn-secondary" id="btn-settings" data-i18n="btn_more_settings">更多设置</button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../learn/page-settings.js"></script>

  <script src="../content/i18n-messages.js"></script>
  <script src="../content/providers.gen.js"></script>
  <script src="../content/learn-model.js"></script>
  <script src="../content/learn-rules.js"></script>
  <script src="../content/learn-scheduler.js"></script>
  <script src="../learn/store.js"></script>
  <script src="../learn/drain.js"></script>
  <script src="popup.js"></script>
</body>
</html>
