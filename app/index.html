<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>大肚猴翻译</title>
  <!-- ../ is load-bearing: the Safari converter puts Main.html in Base.lproj/ while
       Script.js and Style.css sit at the bundle root. Same-directory hrefs 404 and the
       app opens to a blank white screen with nothing in the log. -->
  <link rel="stylesheet" href="../Style.css">
</head>
<body>
  <main id="app">
    <!-- <main id="app"> 的十个 section 自 PR6a（React 迁移）起由 src/app/main.jsx
         挂载：静态 JSX 壳在 src/app/AppShell.jsx，id、初始 hidden 与类名同这里原来的
         标记一一对应（React 只当一次性的 DOM 模板引擎，渲染后由 painters 与各命令式
         视图模块照旧涂写）。
         ⚠️ 本注释在 main 之内，而下面两块刻意留在 main 结束之后：
           · #review-view —— REVIEW 注入槽的宿主（review.html 的 body 构建时塞进来，
             build/app-bundle.js，机制零改）；
           · 三个 app-art 插图 template —— React 渲染 template 的子元素会落在元素
             本体而不是 content fragment，obSteps() 的 tpl.content.cloneNode(true)
             会拿到空；留在静态 HTML 里。
         注释里不许出现构建 SLOT 的字面量（含 "--" 与 ">" 的组合会在解析时提前闭合
         注释，还可能把构建替换引到注释里来 —— 见 app-bundle.js 的 SLOT 次数门）。 -->
  </main>

    <!-- The review surface, lifted from extension/learn/review.html at build time
         (build/app-bundle.js). Not a copy kept in sync by hand — the extension's file
         is the source, and this is the only place the app can put it, since the app
         is exactly three filenames. -->
    <section id="review-view" hidden>
      <button id="review-back" type="button" class="link"></button>
      <!--REVIEW-->
    </section>

    <!-- 启用扩展那一屏的插图。放模板里让 obSteps() 克隆 —— 它们是**图形**，写在标记
         里看得见改得动，比在 JS 里堆 createElementNS 清楚。
         里面**一个要翻译的字都没有**：形状按 iOS Safari 实际布局画，话全在下面的
         <span> 里走 t()。颜色只用调色板令牌（同吉祥物的规矩：重新配色不用碰这里），
         也因此暗色模式免费。id 一律 app- 前缀 —— 与 review.html 撞名会让构建直接失败。 -->
    <template id="app-art-1">
        <svg viewBox="0 0 280 150" aria-hidden="true">
        <rect x="26" y="18" width="228" height="60" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
        <rect x="40" y="32" width="120" height="7" rx="3.5" fill="var(--line)"/>
        <rect x="40" y="46" width="180" height="6" rx="3" fill="var(--line)" opacity=".55"/>
        <rect x="40" y="58" width="150" height="6" rx="3" fill="var(--line)" opacity=".55"/>
        <rect x="26" y="92" width="228" height="42" rx="14" fill="var(--field)" stroke="var(--line)" stroke-width="2"/>
        <path d="M48 113l-7-6 7-6" stroke="var(--text-secondary)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="62" y="101" width="150" height="24" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>
        <rect x="70" y="107" width="13" height="11" rx="2.5" fill="none" stroke="var(--text)" stroke-width="2"/>
        <path d="M70 111.5h4" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
        <text x="92" y="117" font-size="9" font-family="ui-monospace,monospace" fill="var(--text-secondary)">belliedmonkey.cc</text>
        <path d="M198 108a5.5 5.5 0 1 0 4 5.5" stroke="var(--text-secondary)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="232" cy="113" r="1.8" fill="var(--text-secondary)"/><circle cx="238" cy="113" r="1.8" fill="var(--text-secondary)"/><circle cx="244" cy="113" r="1.8" fill="var(--text-secondary)"/>
        <circle cx="76.5" cy="112.5" r="15" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 4"/>
        </svg>
    </template>
    <template id="app-art-2">
        <svg viewBox="0 0 280 150" aria-hidden="true">
        <g>
        <rect x="52" y="24" width="176" height="102" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
        <rect x="66" y="38" width="86" height="7" rx="3.5" fill="var(--line)"/>
        <rect x="196" y="34" width="16" height="14" rx="3" fill="none" stroke="var(--line)" stroke-width="2"/>
        <rect x="60" y="62" width="160" height="26" rx="8" fill="var(--sage-light)"/>
        <rect x="66" y="71.5" width="72" height="7" rx="3.5" fill="var(--sage-strong)"/>
        <rect x="196" y="68" width="16" height="14" rx="3" fill="none" stroke="var(--sage-strong)" stroke-width="2"/>
        <path d="M198 72.5h4" stroke="var(--sage-strong)" stroke-width="2" stroke-linecap="round"/>
        <rect x="66" y="104" width="60" height="7" rx="3.5" fill="var(--line)"/>
        <rect x="196" y="100" width="16" height="14" rx="3" fill="none" stroke="var(--line)" stroke-width="2"/>
        </g>
        <path d="M14 75h32m0 0-9-7m9 7-9 7" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </template>
    <template id="app-art-3">
        <svg viewBox="0 0 280 150" aria-hidden="true">
        <rect x="34" y="20" width="212" height="112" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
        <rect x="112" y="32" width="56" height="7" rx="3.5" fill="var(--text-secondary)" opacity=".45"/>
        <rect x="48" y="50" width="184" height="20" rx="10" fill="var(--field)" stroke="var(--line)"/>
        <circle cx="60" cy="59" r="4" fill="none" stroke="var(--text-secondary)" stroke-width="1.6"/>
        <path d="M63 62l3 3" stroke="var(--text-secondary)" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="48" y="82" width="184" height="34" rx="10" fill="var(--card-bg)" stroke="var(--line)"/>
        <rect x="58" y="90" width="18" height="18" rx="5" fill="var(--accent)"/>
        <rect x="84" y="95.5" width="72" height="7" rx="3.5" fill="var(--text)" opacity=".5"/>
        <rect x="176" y="89" width="42" height="21" rx="10.5" fill="var(--sage-strong)"/>
        <circle cx="207.5" cy="99.5" r="8" fill="#fff"/>
        <rect x="168" y="81" width="58" height="37" rx="18.5" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 4"/>
        </svg>
    </template>

  <p id="status" role="status" aria-live="polite"></p>

  <!-- 快速翻译面板（learning-design §9.9；macOS）。同一份页面以 #quick 加载时，<main> 整个不显示、只显示这一块 ——
       同源 ⇒ 引擎配置、界面语言、错误文案全部复用，不改 pbxproj。平时（没有 #quick）它永远是 hidden。
       文案全部由 app/quick.js 按 id 设；目标语言的选项在运行时从上面的 #target-lang 克隆，不另抄一份清单。 -->
  <section id="quick-root" hidden>
    <div class="qk-head">
      <span id="qk-tag" class="qk-tag"></span>
      <span class="qk-sp"></span>
      <span id="qk-from" class="qk-from"></span>
      <select id="qk-lang"></select>
      <button id="qk-pin" type="button" class="qk-ibtn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 6 3 4H6l3-4z"/></svg></button>
      <button id="qk-close" type="button" class="qk-ibtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <textarea id="qk-src" rows="2" spellcheck="false"></textarea>
    <p id="qk-note" class="qk-note" hidden></p>
    <div id="qk-out" class="qk-out" aria-live="polite"></div>
    <div id="qk-actions" class="qk-actions" hidden></div>
    <div class="qk-foot">
      <span id="qk-state" class="qk-state"></span>
      <button id="qk-copy" type="button" class="qk-ibtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg></button>
    </div>
  </section>
  <script src="../Script.js"></script>
</body>
</html>
