<!DOCTYPE html>
<!-- store-assets/src/og-card.html — 两个官网的分享卡（og:image / twitter:image），1200×630。
     用法: og-card.html?lang=en → belliedmonkey.cc；og-card.html?lang=zh → belliedmonkey.com（中国版）
     渲染: Chrome --headless --window-size=1200,630 --screenshot，再 sips 转 JPEG（两站引用的都是 media/og-card.jpg）。
     素材全是出货产物的实拍（capture.js / capture-app.js 拍的），不画 mock。
     中国版那张：手机图用 dist-app-china 拍的，文案不出现境外站点。
     1.11.0 之前两站共用一张英文卡（网页双语那一帧），中文站分享出去是一张英文维基百科截图。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #f5ead8 0%, #f9f4ed 45%, #ebddc5 100%);
    color: #201e1d; position: relative;
  }
  .head { position: absolute; left: 64px; top: 72px; width: 470px; }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: #8c491a; }
  .kicker img { width: 44px; height: 44px; }
  .big { font-size: 54px; font-weight: 800; line-height: 1.16; margin-top: 28px; letter-spacing: .005em; }
  .sub { font-size: 23px; font-weight: 500; color: #645c50; margin-top: 24px; line-height: 1.5; }
  .mac { position: absolute; left: 548px; top: 150px; width: 520px; background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(46, 43, 37, .28); }
  .mac .bar { height: 26px; background: #ececec; display: flex; align-items: center; gap: 6px; padding-left: 12px; }
  .mac .dot { width: 9px; height: 9px; border-radius: 50%; }
  .mac img { display: block; width: 100%; height: auto; }
  .phone { position: absolute; right: 40px; top: 96px; height: 500px; background: #111; border-radius: 34px; padding: 9px;
    box-shadow: 0 24px 60px rgba(46, 43, 37, .34); z-index: 2; }
  .phone img { display: block; height: 100%; width: auto; border-radius: 26px; }
</style>
</head>
<body>
<div class="head">
  <div class="kicker"><img src="../../extension/icons/icon.svg" alt=""><span id="brand"></span></div>
  <div class="big" id="big"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="mac"><div class="bar"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div></div><img id="mac" alt=""></div>
<div class="phone"><img id="phone" alt=""></div>
<script>
const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
const C = {
  en: {
    brand: 'BelliedMonkey Translator',
    big: 'Read, watch and talk in two languages',
    sub: 'Bilingual web pages, Live Subtitles for any app, and a live conversation interpreter. Open source.',
    mac: 'assets/f1-article.png',
    phone: 'assets/en-phone-listen.png',
  },
  zh: {
    brand: '大肚猴翻译',
    big: '读、看、聊，<br>都是双语',
    sub: '网页双语对照 · 任何 App 的实时字幕<br>面对面对话听译 · 开源',
    mac: 'assets/f1-article.png',
    phone: '../../screenshots-cn/src/assets/cn-phone-listen.png',
  },
}[lang];
document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
document.getElementById('brand').textContent = C.brand;
document.getElementById('big').innerHTML = C.big;
// 中文副标题手动断行：自动折行会把「面对面」从中间拆开
document.getElementById('sub').innerHTML = C.sub;
document.getElementById('mac').src = C.mac;
document.getElementById('phone').src = C.phone;
</script>
</body>
</html>
