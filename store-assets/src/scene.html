<!DOCTYPE html>
<!-- store-assets/src/scene.html — 全球版商店合成图模板（学习闭环连环画）。
     用法: scene.html?f=1..5&lang=zh|en&w=1242&h=2688
     render.sh 用 headless Chrome 按精确分辨率截图（仿 screenshots-cn 流水线）。
     门禁注意：标注文案不点任何供应商名（global descriptionBrandGate 的精神）。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #c67139; --accent-deep: #8c491a; --ink: #201e1d; --paper: #f5ead8;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #f5ead8 0%, #f9f4ed 45%, #ebddc5 100%);
    display: flex; flex-direction: column; align-items: center;
    color: var(--ink);
  }
  .headline {
    text-align: center; font-weight: 800; letter-spacing: .01em;
    padding: 6% 6% 2%; line-height: 1.22;
  }
  .headline .big { font-size: var(--h1); display: block; }
  .headline .sub { font-size: var(--h2); display: block; margin-top: .55em; font-weight: 500; color: #645c50; }
  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 0 5% 6%; position: relative; }
  /* 桌面窗口框 */
  .mac { background: #fff; border-radius: 18px; box-shadow: 0 30px 80px rgba(46,43,37,.28); overflow: hidden; max-width: 100%; max-height: 100%; }
  .mac .bar { height: 34px; background: #ececec; display: flex; align-items: center; padding-left: 14px; gap: 7px; }
  .mac .dot { width: 11px; height: 11px; border-radius: 50%; }
  .mac img { display: block; width: 100%; height: auto; }
  /* 手机框 */
  .phone { background: #111; border-radius: 46px; padding: 12px; box-shadow: 0 30px 80px rgba(46,43,37,.32); max-height: 100%; }
  .phone img { display: block; border-radius: 36px; width: 100%; height: 100%; }
  .tablet { background: #111; border-radius: 32px; padding: 20px; box-shadow: 0 30px 80px rgba(46,43,37,.32); }
  .tablet img { display: block; border-radius: 16px; width: 100%; height: 100%; }
  .cascade { position: relative; width: 100%; height: 100%; }
  .pair { display: flex; align-items: center; justify-content: center; gap: 2%; width: 100%; height: 100%; }
  .pair .arrow { font-size: calc(var(--h1) * 1.1); }
  /* 双设备同框 */
  .duo { position: relative; width: 100%; height: 100%; }
  .duo .mac { position: absolute; left: 1%; top: 6%; width: 72% !important; }
  .duo .phone { position: absolute; right: 1%; bottom: 0; width: 27%; z-index: 2; }
  .arrow {
    position: absolute; z-index: 3; left: 66%; top: 20%;
    font-size: calc(var(--h1) * 1.3); color: var(--accent); font-weight: 800;
    text-shadow: 0 2px 12px rgba(255,255,255,.9);
  }
  .badge {
    display: inline-block; background: var(--accent); color: #fff; border-radius: 999px;
    padding: .35em 1em; font-size: calc(var(--h2) * .9); font-weight: 700; margin-top: .8em;
  }
</style>
</head>
<body>
<div class="headline"><span class="big" id="big"></span><span class="sub" id="sub"></span></div>
<div class="stage" id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const f = q.get('f') || '1';
const lang = q.get('lang') || 'zh';
const W = +q.get('w') || 1242, H = +q.get('h') || 2688;
const portrait = H > W;
document.documentElement.style.setProperty('--h1', Math.round((portrait ? W : H) * (portrait ? 0.058 : 0.075)) + 'px');
document.documentElement.style.setProperty('--h2', Math.round((portrait ? W : H) * (portrait ? 0.031 : 0.040)) + 'px');

const COPY = {
  zh: {
    1: ['照常读外网', '原文与译文，同屏对照'],
    2: ['看视频，字幕跟着走', '原文在上，译文在下，逐句对齐'],
    3: ['读过的句子，自动变成复习卡', '快速滚过的不算——只留下你真正读过的'],
    4: ['手机上复习', '读 · 听 · 写 三档 + 句子解析 + 朗读'],
    5: ['电脑上读，手机上复习', '翻译与学习，一个闭环'],
    // 6：1.7 的主角。前五帧讲的都是「配好之后能干什么」，而新用户的第一个问题是
    // 「要配多久」——这一帧回答它：一把 key，三样一起配好。
    6: ['一把 key，三样一起配好', '翻译、朗读、转写 —— 填完当场自检，不用等到翻第一页'],
  },
  en: {
    1: ['Browse like you always do', 'Original and translation, side by side'],
    2: ['Watch with dual subtitles', 'Matched sentence by sentence'],
    3: ['Sentences you read become review cards', 'Only what you actually read — skimming doesn\'t count'],
    4: ['Review on your phone', 'Read · Listen · Write + sentence notes + read-aloud'],
    5: ['Read on your computer, review on your phone', 'Translation and learning, one loop'],
    6: ['One key sets up all three', 'Translate, read aloud, transcribe — tested on the spot, before your first page'],
  },
};
// 第 5 帧的竖版画布里没有 Mac（手机画布是两台手机、iPad 画布是 iPad + 手机），标题不能再说「电脑上读」。
const PORTRAIT5 = { zh: ['读到哪，复习到哪', '电脑、平板、手机同步，一个闭环'], en: ['Read anywhere, review anywhere', 'Synced across your devices — one loop'] };
const [big, sub] = (f === '5' && H > W) ? PORTRAIT5[lang] : COPY[lang][f];
document.getElementById('big').textContent = big;
document.getElementById('sub').textContent = sub;

// ── 设备档位：画布是什么设备，就放那个设备视口拍的图（2026-09-06 的硬规矩，见 ../README.md）──
// 竖版窄画布 = iPhone → phone 档；竖版宽画布 = iPad → tablet 档；横版 = Mac / Chrome 商店 → desk 档。
const tier = !portrait ? 'desk' : (W >= 1500 ? 'tablet' : 'phone');
const ARTICLE = { phone: 'assets/phone-article.png', tablet: 'assets/tablet-article.png', desk: 'assets/f1-article.png' };
const VIDEO = { phone: 'assets/phone-video.png', tablet: 'assets/tablet-video.png', desk: 'assets/f2-video.png' };
const own = (kind, t) => `assets/${lang}-${t || tier}-${kind}.png`;

const mac = (src, w) => `<div class="mac" style="width:${w || '96%'}"><div class="bar"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div></div><img src="${src}"></div>`;
const phone = (src) => `<div class="phone"><img src="${src}"></div>`;
const tablet = (src) => `<div class="tablet"><img src="${src}"></div>`;
const device = (src, t) => ({ phone, tablet, desk: mac })[t || tier](src);

const stage = document.getElementById('stage');
if (f === '1') stage.innerHTML = device(ARTICLE[tier]);
else if (f === '2') stage.innerHTML = device(VIDEO[tier]);
else if (f === '3') stage.innerHTML = device(own('card'));
else if (f === '4') stage.innerHTML = device(own('stats'));
else if (f === '6') stage.innerHTML = device(own('onboard'));
else if (f === '5') {
  // 跨设备闭环。横版：Mac 上读 → 手机上复习（手机是这一帧的主语，不是错放）。
  // 竖版：这台设备上读 → 手机上复习；手机画布里就是两台手机（读的那台 / 复习的那台）。
  if (!portrait) stage.innerHTML = `<div class="duo">${mac(ARTICLE.desk)}<div class="arrow">⟶</div>${phone(own('card', 'phone'))}</div>`;
  else if (tier === 'tablet') stage.innerHTML = `<div class="pair">${device(ARTICLE[tier])}<div class="arrow" style="position:static">⟶</div>${phone(own('card', 'phone'))}</div>`;
  // 手机画布放不下两台并排还能读清字的手机：斜向叠放，读的那台在左上，复习的那台压在右下。
  else stage.innerHTML = `<div class="cascade">${phone(ARTICLE.phone)}${phone(own('card', 'phone'))}</div>`;
}

// 尺寸：设备框按舞台可用高铺满（宽度随截图比例走），永远不超出画布。
// mac 窗口另加 34px 标题栏；桌面档三张自拍图是 2200×1520，与真 Safari 手拍的 f1/f2（1728×868）比例不同，
// 所以宽度要等图片加载后按各自的自然尺寸算，不能写死。
const stageH = stage.clientHeight, stageW = stage.clientWidth;
document.querySelectorAll('.mac img').forEach((img) => {
  const fit = () => {
    const box = img.closest('.mac');
    const inPair = !!box.closest('.pair');
    const maxH = (inPair ? stageH * 0.9 : stageH) - 34, maxW = box.closest('.duo') ? stageW * 0.72 : stageW * (inPair ? 0.58 : 0.94);
    box.style.width = Math.min(maxW, maxH * img.naturalWidth / img.naturalHeight) + 'px';
  };
  if (img.complete) fit(); else img.onload = fit;
});
document.querySelectorAll('.phone, .tablet').forEach((box) => {
  const img = box.querySelector('img');
  const fit = () => {
    const pad = box.classList.contains('phone') ? 24 : 40;
    const inPair = !!box.closest('.pair'), inDuo = !!box.closest('.duo'), inCascade = !!box.closest('.cascade');
    const isPhone = box.classList.contains('phone');
    const maxH = inDuo ? stageH * 0.94 : inCascade ? stageH * 0.74 : inPair ? (isPhone ? stageH * 0.6 : stageH * 0.74) : stageH * 0.96;
    const maxW = inDuo ? stageW * 0.27 : inCascade ? stageW * 0.7 : inPair ? (isPhone ? stageW * 0.32 : stageW * 0.6) : stageW * 0.9;
    const h = Math.min(maxH, (maxW - pad) * img.naturalHeight / img.naturalWidth + pad);
    box.style.height = h + 'px'; box.style.width = ((h - pad) * img.naturalWidth / img.naturalHeight + pad) + 'px';
    if (inDuo) { box.style.position = 'absolute'; box.style.right = '1%'; box.style.bottom = '0'; }
    if (inCascade) { const second = box.previousElementSibling; box.style.position = 'absolute'; if (second) { box.style.right = '0'; box.style.bottom = '0'; box.style.zIndex = 2; } else { box.style.left = '0'; box.style.top = '0'; } }
  };
  if (img.complete) fit(); else img.onload = fit;
});
</script>
</body>
</html>
