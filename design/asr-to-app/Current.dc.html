<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:#f5ead8; color:#201e1d;
      font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", "Noto Sans", sans-serif; }
    a { color:#8c491a; } a:hover { color:#643312; }
    .pop { width:320px; background:#f5ead8; border:1px solid #dcd3c4; border-radius:14px; overflow:hidden; }
    .sec { border-top:1px solid #dcd3c4; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
    .sec:first-child { border-top:none; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:44px; }
    .lab { font-size:.95rem; }
    .val { color:#6a6255; font-size:.84rem; }
    .note { background:#f9f4ed; border:1px solid #dcd3c4; border-radius:10px; padding:10px; font-size:.84rem; color:#6a6255; line-height:1.5; }
    .cta { background:#ac6231; color:#fff; border-radius:10px; min-height:44px; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:.92rem; }
    .quiet { border:1px solid #dcd3c4; color:#8c491a; border-radius:10px; min-height:44px; display:flex; align-items:center; justify-content:center; font-size:.9rem; }
    .cap { font-size:.78rem; font-weight:700; color:#6a6255; letter-spacing:.04em; }
    .foot { border-top:1px dashed #dcd3c4; background:#f9f4ed; padding:13px 16px; display:flex; flex-direction:column; gap:6px; font-size:.84rem; line-height:1.5; color:#6a6255; }
    b { color:#201e1d; } code { font-family:ui-monospace,Menlo,monospace; font-size:.8rem; color:#8c491a; }
    .gone { text-decoration:line-through; opacity:.45; }
  </style>
</helmet>
<div style="display:flex; flex-direction:column; height:620px; padding:20px; gap:12px; box-sizing:border-box">
  <div class="cap">现状 · 两档并存</div>
  <div class="pop">
    <div class="sec"><div class="row"><span class="lab">翻译这个页面</span><span class="val">DeepSeek</span></div></div>
    <div class="sec">
      <div class="row"><span class="lab">🎙 实时转写 + 翻译</span><span class="val">›</span></div>
      <div class="note">该转写引擎没有实时接口，此媒体无法转写</div>
      <div class="quiet">先在设置里选择转写引擎</div>
    </div>
  </div>
  <div style="background:#fff; border:1px solid #dcd3c4; border-radius:12px; padding:12px; font-size:.84rem; line-height:1.6; color:#6a6255">
    <b>路由（asr-source.js:379-386）</b><br>
    <code>CORS 可读的 http(s) URL</code> → <b>Tier A 整段转写</b><br>
    否则 / 媒体类失败 → <b class="gone">Tier B 流式实时</b>
  </div>
  <div style="flex:1"></div>
  <div class="foot">
    <div><b>Tier B 在扩展里注定是纯远程 API。</b>七个 stt 条目里有实时接口的只有两个（国际一个、中国一个）；<code>device</code>/<code>local</code> 在扩展侧只能 <code>live:false</code> —— 本机转写是原生能力，扩展够不到。</div>
    <div>遥测：<code>asr_entry</code> 全期 <b>7 台装机</b>触发过，全是 started。</div>
  </div>
</div>
</x-dc>
</body>
</html>
