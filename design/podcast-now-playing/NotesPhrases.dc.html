<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
    a { color: #c67139; } a:hover { color: #8c491a; }
  </style>
</helmet>
<div style="width: 1024px; height: 1024px; box-sizing: border-box; background: #f5ead8; padding: 48px; display: flex;">
  <div style="flex: 1; border-radius: 60px; background: #ffffff; box-shadow: 0 1px 2px rgba(46,43,37,0.14); padding: 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 30px;">

    <div style="display: flex; align-items: center; flex: none;">
      <div style="background: #c67139; color: #fff; font-size: 30px; font-weight: 600; padding: 9px 24px; border-radius: 999px; letter-spacing: 0.4px;">第 3 / 20 张</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; min-height: 0;">
      <div style="color: #201e1d; font-size: 58px; line-height: 1.5; font-weight: 500; text-wrap: pretty;">Once people began sharing workspaces, apps, and outputs.</div>
      <div style="color: #3d472b; font-size: 52px; line-height: 1.55; text-wrap: pretty;">一旦人们开始共享工作区、应用和输出内容。</div>
    </div>

    <div style="flex: none; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 16px; align-items: stretch;">
        <div style="width: 6px; flex: none;"></div>
        <div style="color: #82796a; font-size: 30px; line-height: 1.4; font-weight: 400; flex: 1;">生词：sharing，共享。outputs，输出内容。</div>
      </div>
      <div style="display: flex; gap: 16px; align-items: stretch;">
        <div style="width: 6px; border-radius: 3px; background: #c67139; flex: none;"></div>
        <div style="color: #201e1d; font-size: 30px; line-height: 1.4; font-weight: 600; flex: 1;">短语：began sharing，开始共享。</div>
      </div>
      <div style="display: flex; gap: 16px; align-items: stretch;">
        <div style="width: 6px; flex: none;"></div>
        <div style="color: #82796a; font-size: 30px; line-height: 1.4; font-weight: 400; flex: 1;">语法：一般过去时，began 是 begin 的过去式。</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
