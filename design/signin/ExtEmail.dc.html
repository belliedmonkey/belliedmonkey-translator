<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>扩展设置页 · 邮箱展开</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');
    :root { --bg:#f5ead8; --card:#ffffff; --section:#f9f4ed; --input:#f9f4ed; --text:#201e1d; --muted:#82796a; --border:#dcd3c4;
            --accent:#c67139; --accent-deep:#8c491a; --accent-track:#ffe1d0; --sage:#728157; --danger:#b3261e;
            --apple-bg:#000000; --apple-fg:#ffffff; --google-bg:#ffffff; --google-fg:#201e1d; --google-border:#dcd3c4;
            --shadow:0 1px 2px rgba(46,43,37,.14); }
    .dark { --bg:#1d1b19; --card:#2a2723; --section:#262320; --input:#1f1d1a; --text:#f1ebe2; --muted:#a79d8d; --border:#3f3a34;
            --accent:#d98b57; --accent-deep:#f0b48a; --accent-track:#4a3324; --apple-bg:#ffffff; --apple-fg:#000000;
            --google-bg:#2a2723; --google-fg:#f1ebe2; --google-border:#4b453e; --shadow:0 1px 2px rgba(0,0,0,.4); }
    body { margin:0; font-family:"Figtree", -apple-system, system-ui, sans-serif; color:var(--text); }
    a { color:var(--accent-deep); } a:hover { color:var(--accent); }
    .root { background:var(--bg); color:var(--text); box-sizing:border-box; }
    .h { font-family:"Caprasimo", "Figtree", system-ui, sans-serif; font-weight:400; margin:0; }
    .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:48px; padding:12px 18px;
           border-radius:999px; font:inherit; font-size:16px; font-weight:600; border:0; cursor:pointer; box-sizing:border-box; }
    .btn.apple { background:var(--apple-bg); color:var(--apple-fg); }
    .btn.google { background:var(--google-bg); color:var(--google-fg); border:1.5px solid var(--google-border); }
    .btn.primary { background:var(--accent); color:#fff; box-shadow:var(--shadow); }
    .btn.outline { background:none; color:var(--accent-deep); border:1.5px solid var(--accent); font-weight:700; }
    .link { background:none; border:0; padding:12px 8px; min-height:44px; display:inline-flex; align-items:center; font:inherit; color:var(--accent-deep); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .label { font-size:13px; color:var(--muted); }
    .input { width:100%; box-sizing:border-box; font:inherit; font-size:16px; padding:12px 16px; border-radius:999px; border:1.5px solid var(--border); background:var(--input); color:var(--text); }
    .input.placeholder { color:var(--muted); }
    .code { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:8px; }
    .code .cell { height:52px; border-radius:14px; border:1.5px solid var(--border); background:var(--input); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
    .code .cell.on { border-color:var(--accent); }
    .muted { color:var(--muted); }
    .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); }
    .panel { background:var(--section); border:1px solid var(--border); border-radius:16px; }
  </style>
</helmet>

<div class="{{rootClass}}" style="width: 560px; height: 520px; padding: 24px;">
  <div class="card" style="display: flex; flex-direction: column; gap: 16px; padding: 22px 24px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700;">登录 · 多设备同步</h2>
      <p class="muted" style="margin: 0; font-size: 13px; line-height: 1.55;">卡片是浏览器扩展采集的。登录同一个账号，它们就会同步到这台设备。</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <button class="btn apple" type="button"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"></path></svg><span>用 Apple 登录</span></button>
      <button class="btn google" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg><span>用 Google 登录</span></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
      <span class="muted" style="font-size: 12px;">或用邮箱登录</span>
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="field">
        <span class="label">邮箱</span>
        <div class="input placeholder">you@example.com</div>
      </div>
      <button class="btn outline" type="button" style="min-height: 44px; font-size: 14px;">发送验证码</button>
    </div>
    <p class="muted" style="margin: 0; font-size: 12px; line-height: 1.55;">可选。不登录也能完整使用 —— 采集和复习都在本机，登录只是为了同步到别的设备。</p>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":560,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { rootClass: this.props.dark ? 'root dark' : 'root' };
  }
}
</script>
</body>
</html>
