<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>B1 · 准备页 · 两种开始方式</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8c491a; } a:hover { color: #ac6231; }
    .root { --bg: #f5ead8; --card: #ffffff; --section: #f9f4ed; --text: #201e1d; --dim: #6a6255; --line: #dcd3c4;
            --accent: #ac6231; --accent-deep: #8c491a; --link: #8c491a; --accent-track: #ffe1d0; --sage: #728157; --sage-strong: #56633f; --danger: #b3261e;
            background: var(--bg); color: var(--text); box-sizing: border-box; font-size: 16px; line-height: 1.45; position: relative; overflow: hidden; }
    .root.dark { --bg: #0f172a; --card: #1e293b; --section: #273549; --text: #f9fafb; --dim: #9ca3af; --line: #374151;
            --accent-deep: #f6a06b; --link: #f6a06b; --accent-track: #643312; --sage: #8fa073; --sage-strong: #aebf92; --danger: #ff7070; }
    .root * { box-sizing: border-box; }
    .root p, .root h1, .root h2, .root h3 { margin: 0; }
    .root button { font: inherit; cursor: default; }
  </style>
</helmet>
<div class="{{rootClass}}" style="width: 390px; height: 844px; padding: 59px 20px 34px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: center; gap: 12px;"><span style="color: var(--accent-deep); text-decoration: underline; padding: 6px 0; font-size: 16px;">← 返回</span><h2 style="font-size: 20px; margin: 0; flex: 1; font-weight: 700;">实时字幕</h2></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><div style="display: flex; align-items: center; gap: 6px; font-size: 13.6px; color: var(--dim);"><span>视频的语言</span><span style="display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-size: 15px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px;">English<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none;"><path d="M6 9l6 6 6-6"></path></svg></span></div><div style="display: flex; align-items: center; gap: 6px; font-size: 13.6px; color: var(--dim);"><span>我的语言</span><span style="display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-size: 15px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px;">中文<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none;"><path d="M6 9l6 6 6-6"></path></svg></span></div></div>
<div style="background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; gap: 4px; padding: 12px 16px;"><div style="display: flex; flex-direction: column; gap: 4px; font-size: 14.4px;"><div><span style="color: var(--dim);">转写</span>　设备内置转写（本机 · 免费）</div><div><span style="color: var(--dim);">翻译</span>　DeepSeek · deepseek-v4-flash</div></div></div>
<div style="display: flex; flex-direction: column;"><div style="display: flex; align-items: center; gap: 10px; font-size: 14.4px; min-height: 44px;"><span style="width: 22px; height: 22px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--sage); border: 1.5px solid var(--sage);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>字幕进复习（来源「实时字幕」）</span></div><div style="display: flex; align-items: center; gap: 10px; font-size: 14.4px; min-height: 44px;"><span style="width: 22px; height: 22px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1.5px solid var(--line);"></span><span>这次不留记录</span></div></div>
<button type="button" style="font-size: 16.8px; font-weight: 700; color: #ffffff; background: var(--accent); border: 0; border-radius: 16px; padding: 14px 12px; min-height: 64px; ">开始（外放）</button>
<button type="button" style="font-size: 16.8px; font-weight: 700; color: var(--accent-deep); background: none; border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px;"><span style="display: flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none;"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.6" fill="currentColor"></circle></svg>用屏幕录制方式开始</span><span style="font-size: 12.8px; font-weight: 400; color: var(--dim);">戴耳机也能用</span></button>
<p style="margin: 0; color: var(--dim); font-size: 13.6px; line-height: 1.5; text-wrap: pretty; ">只在你开始屏幕录制后取这台 iPhone 播放的声音；屏幕画面收到即丢，一帧都不读。声音只在本机识别（或只发往你配置的转写端点），不录音、不保存，我们的服务器不参与。只有「字幕进复习」开着时，识别出的文字才会留在复习里。</p>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"主题"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rootClass: this.props.dark ? 'root dark' : 'root' };
  }
}
</script>
</body>
</html>
