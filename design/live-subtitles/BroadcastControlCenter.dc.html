<x-dc>
<helmet>
  <title>B7 · 控制中心路径</title>
  <style>

    a { color: #8c491a; } a:hover { color: #ac6231; }

    .root.dark { --bg: #0f172a; --card: #1e293b; --section: #273549; --text: #f9fafb; --dim: #9ca3af; --line: #374151;

    .root button { font: inherit; cursor: default; }
  </style>
</helmet>
<div class="{{rootClass}}" style="width: 560px; height: 420px; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px;">

><span style="align-self: center; color: var(--accent);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none;"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></span><div style="flex: 1; min-width: 0; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;"><span style="width: 52px; height: 52px; border-radius: 14px; background: var(--section); color: var(--accent-deep); display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><p style="font-size: 14px; font-weight: 700;">③ 选「大肚猴翻译」</p><p style="font-size: 12.8px; color: var(--dim);">点「开始直播」</p></div>
</div>
</div>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"主题"},"$preview":{"width":560,"height":420}}'>

    return { rootClass: this.props.dark ? 'root dark' : 'root' };
