<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --color-bg:#f5ead8;--color-surface:#ebddc5;--color-text:#201e1d;
  --color-accent:#c67139;--color-accent-2:#7a8a5e;
  --color-neutral-100:#f9f4ed;--color-neutral-200:#eee7db;--color-neutral-300:#dcd3c4;
  --color-neutral-600:#82796a;--color-neutral-900:#2e2b25;
  --color-accent-100:#fff2eb;--color-accent-200:#ffe1d0;--color-accent-400:#f6a06b;
  --color-accent-600:#b2622d;--color-accent-700:#8c491a;--color-accent-800:#643312;
  --color-accent-2-100:#f0fae1;--color-accent-2-200:#e1eecc;--color-accent-2-300:#ccdbb2;
  --color-accent-2-600:#728157;--color-accent-2-700:#56633f;--color-accent-2-800:#3d472b;
  --font-heading:"Caprasimo",system-ui,sans-serif;--font-body:"Figtree",system-ui,sans-serif;
  --radius-md:16px;--radius-lg:28px;
  --shadow-sm:0 1px 2px rgba(46,43,37,.14);--shadow-md:0 3px 10px rgba(46,43,37,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text)}
a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.pri{background:var(--color-accent);color:#fff;border-radius:999px;padding:14px 20px;
  min-height:52px;font-size:17px;font-weight:600;width:100%;box-shadow:var(--shadow-sm)}
.pri:hover{background:var(--color-accent-600)}
.pri:disabled{opacity:.45}
.ghost{border-radius:999px;padding:12px 18px;min-height:48px;font-size:15px;
  color:var(--color-neutral-600);width:100%}
.ghost:hover{background:rgba(32,30,29,.05)}
.chip{border:1.5px solid var(--color-neutral-300);background:#fff;border-radius:999px;
  padding:11px 16px;min-height:46px;font-size:15px;color:var(--color-text)}
.chip:hover{border-color:var(--color-accent-400)}
.card{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.h{font-family:var(--font-heading);font-weight:400;color:var(--color-text);margin:0}
.sub{margin:0;font-size:15px;line-height:1.55;color:rgba(32,30,29,.62)}
.step{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600);margin:0}
</style>
</helmet>
<div style="width:560px;height:420px;display:flex;flex-direction:column;background:var(--color-bg);padding:34px 38px;gap:18px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <p class="step">macOS 变体 · 对应流程第 3 步</p>
    <h1 class="h" style="font-size:26px;line-height:1.25">在 Safari 里打开它</h1>
    <p class="sub">macOS 上不用念步骤 —— 系统给了直达入口，App 也已经知道扩展开没开。</p>
  </div>
  <div style="border-radius:var(--radius-md);padding:12px 15px;display:flex;align-items:center;gap:10px;background:var(--color-accent-100)">
    <div style="width:9px;height:9px;border-radius:999px;background:var(--color-accent-400)"></div>
    <span style="font-size:14px;font-weight:600;color:var(--color-accent-800)">扩展还没启用</span>
  </div>
  <button class="pri" style="width:auto;align-self:flex-start;padding:14px 26px">打开 Safari 扩展设置</button>
  <div style="background:var(--color-accent-2-100);border-radius:var(--radius-md);padding:14px 16px;margin-top:auto">
    <p style="margin:0;font-size:13.5px;line-height:1.55;color:var(--color-accent-2-800)">这个按钮背后的 Swift 早就在工程里 —— 转换器模板自带 <b style="font-weight:600">SFSafariApplication.showPreferencesForExtension</b> 和读取启用状态的调用，只是我们换掉模板页之后没接手。iOS 没有等价 API，所以那边只能念步骤。</p>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
