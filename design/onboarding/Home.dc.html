<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --color-bg:#f5ead8;--color-surface:#ebddc5;--color-text:#201e1d;
  --color-accent:#c67139;--color-accent-2:#7a8a5e;
  --color-neutral-100:#f9f4ed;--color-neutral-200:#eee7db;--color-neutral-300:#dcd3c4;
  --color-neutral-600:#82796a;--color-neutral-900:#2e2b25;
  --color-accent-100:#fff2eb;--color-accent-200:#ffe1d0;--color-accent-300:#ffc6a5;--color-accent-400:#f6a06b;
  --color-accent-600:#b2622d;--color-accent-700:#8c491a;--color-accent-800:#643312;
  --color-accent-2-100:#f0fae1;--color-accent-2-200:#e1eecc;--color-accent-2-300:#ccdbb2;
  --color-accent-2-600:#728157;--color-accent-2-700:#56633f;--color-accent-2-800:#3d472b;
  --font-heading:"Caprasimo",system-ui,sans-serif;--font-body:"Figtree",system-ui,sans-serif;
  --radius-md:16px;--radius-lg:28px;
  --shadow-sm:0 1px 2px rgba(46,43,37,.14);--shadow-md:0 3px 10px rgba(46,43,37,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text)}
a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.pri{background:var(--color-accent);color:#fff;border-radius:999px;padding:14px 20px;
  min-height:52px;font-size:17px;font-weight:600;width:100%;box-shadow:var(--shadow-sm)}
.pri:hover{background:var(--color-accent-600)}
.pri:disabled{opacity:.45}
.ghost{border-radius:999px;padding:12px 18px;min-height:48px;font-size:15px;
  color:var(--color-neutral-600);width:100%}
.ghost:hover{background:rgba(32,30,29,.05)}
.chip{border:1.5px solid var(--color-neutral-300);background:#fff;border-radius:999px;
  padding:11px 16px;min-height:46px;font-size:15px;color:var(--color-text)}
.chip:hover{border-color:var(--color-accent-400)}
.card{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.h{font-family:var(--font-heading);font-weight:400;color:var(--color-text);margin:0}
.sub{margin:0;font-size:15px;line-height:1.55;color:rgba(32,30,29,.62)}
.step{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600);margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--color-bg);overflow:hidden">
  <div style="padding:52px 22px 0;display:flex;align-items:center;gap:10px;flex:none">
    <span style="font-family:var(--font-heading);font-size:20px;flex:1">大肚猴翻译</span>
    <button aria-label="设置" style="width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--color-neutral-600)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="16" cy="18" r="2"></circle></svg>
    </button>
  </div>
  <div style="flex:1;overflow:auto;padding:22px 22px 0;display:flex;flex-direction:column;gap:16px">
    <div style="background:var(--color-accent-100);border:1.5px solid var(--color-accent-300);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:9px">
        <div style="width:9px;height:9px;border-radius:999px;background:var(--color-accent-400)"></div>
        <b style="font-size:15px;font-weight:600;color:var(--color-accent-800)">浏览器那半边还没打通</b>
      </div>
      <p style="margin:0;font-size:14px;line-height:1.55;color:var(--color-accent-800)">卡片来自 Safari 扩展。还没启用它，所以这里会一直是空的。</p>
      <button style="background:var(--color-accent);color:#fff;border-radius:999px;padding:12px 18px;min-height:48px;font-size:15px;font-weight:600;box-shadow:var(--shadow-sm)">去启用 · 约 2 分钟</button>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;padding:2px 2px 0">
      <span style="font-family:var(--font-heading);font-size:56px;line-height:1">0</span>
      <span style="font-size:14px;color:rgba(32,30,29,.55)">张卡待复习</span>
    </div>
    <div style="display:flex;gap:9px">
      <div class="card" style="flex:1"><b style="display:block;font-family:var(--font-heading);font-weight:400;font-size:26px;color:var(--color-accent-700)">0</b><span style="font-size:12px;color:rgba(32,30,29,.55)">今日新卡</span></div>
      <div class="card" style="flex:1"><b style="display:block;font-family:var(--font-heading);font-weight:400;font-size:26px;color:var(--color-accent-2-700)">0</b><span style="font-size:12px;color:rgba(32,30,29,.55)">学习中</span></div>
      <div class="card" style="flex:1"><b style="display:block;font-family:var(--font-heading);font-weight:400;font-size:26px">0</b><span style="font-size:12px;color:rgba(32,30,29,.55)">已掌握</span></div>
    </div>
    <div style="height:1px;background:var(--color-neutral-200);margin:4px 0"></div>
    <div style="display:flex;align-items:center;gap:13px;padding:2px">
      <div style="flex:1;display:flex;flex-direction:column;gap:3px">
        <b style="font-size:15px;font-weight:600">多设备同步</b>
        <span style="font-size:13px;color:rgba(32,30,29,.55)">可选。不登录也能完整使用。</span>
      </div>
      <button class="chip" style="min-height:44px;padding:10px 18px;font-size:14px">登录</button>
    </div>
  </div>
  <div style="flex:none;padding:16px 22px 30px">
    <button class="pri" disabled="disabled">开始复习</button>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
