<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:#f5ead8; color:#201e1d;
      font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", "Noto Sans", sans-serif; }
    a { color:#8c491a; } a:hover { color:#643312; }
  </style>
</helmet>
<div style="display:flex; flex-direction:column; height:720px">

  <div style="flex:1; min-height:0; padding:32px 20px 24px; display:flex; flex-direction:column; gap:18px">

    <div style="display:flex; align-items:center; gap:12px; font-weight:700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ac6231" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8 5v3c0 3-1.6 5.6-4 7"/><path d="M6 11c1.4 2.4 3.6 4.2 6 5"/><path d="M13 19l4-9 4 9M14.6 16h4.8"/></svg>
      <span>BelliedMonkey Translator</span>
    </div>

    <div style="height:4px; background:#dcd3c4; border-radius:999px; overflow:hidden; flex:none">
      <div style="height:100%; width:50%; background:#8fa073; border-radius:999px"></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px; flex:1; min-height:0">
      <h2 style="margin:0; font-size:1.35rem; line-height:1.3">你想怎么开始？</h2>
      <p style="margin:0; color:#6a6255">两条路都能用，之后随时能换。</p>

      <div style="background:#fff; border:2px solid #ac6231; border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px">
        <div style="display:flex; align-items:center; gap:10px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8fa073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 8h7a3 3 0 0 1 0 6H7"/></svg>
          <span style="font-weight:600; font-size:1.05rem">用免费额度开始</span>
          <span style="background:#ffe1d0; color:#8c491a; font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.03em">推荐</span>
        </div>
        <p style="margin:0; color:#6a6255; font-size:.92rem; line-height:1.55">不用申请 API key，登录一下就能翻。够日常读几百段网页和字幕。</p>
        <div style="background:#ac6231; color:#fff; padding:15px 24px; border-radius:12px; font-weight:600; text-align:center; font-size:1rem">免费开始 →</div>
      </div>

      <div style="background:#fff; border:1px solid #dcd3c4; border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px">
        <div style="display:flex; align-items:center; gap:10px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6a6255" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 1 1-3.4 6.1L9 15.7l-2 .3-.3 2-2.4.4.4-2.4 2-.3.3-2 2.6-2.6A4 4 0 0 1 15 7z"/><circle cx="16.5" cy="7.5" r="1"/></svg>
          <span style="font-weight:600; font-size:1.05rem">我有自己的 API key</span>
        </div>
        <p style="margin:0; color:#6a6255; font-size:.92rem; line-height:1.55">一把 key 同时配好翻译、朗读、转写；也可以三个引擎分别配。</p>
        <div style="border:1px solid #dcd3c4; color:#8c491a; padding:14px 24px; border-radius:12px; text-align:center; font-size:.98rem">去配置 →</div>
      </div>

      <p style="margin:2px 0 0; color:#6a6255; font-size:.85rem; line-height:1.5">额度用完了随时能换成自己的 key —— 设置里一步。</p>
    </div>

    <div style="display:flex; align-items:center; gap:14px; flex:none; padding-top:4px">
      <div style="color:#8c491a; font-size:.95rem">跳过，我先看看</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
