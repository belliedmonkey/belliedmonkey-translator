<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>快捷键录制 · 五态</title>
  <script src="./support.js"></script>
  <link rel="stylesheet" href="./ui.css">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:#f5ead8; }
    a { color:#8c491a; } a:hover { color:#643312; }
  </style>
</helmet>
<div class="page" style="width:1320px; height:460px; padding:24px; display:flex; flex-direction:column; gap:18px">
<div class="frame-h"><div class="cap"><h1 style="margin:0;font-size:1.25rem">快捷键录制控件</h1><span>新控件族，只此一份组件；三个快捷键共用。</span></div></div>
<div style="display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:18px; align-items:start">
<div class="cell"><div class="cap"><b>空</b></div><div class="rec"><span style="color:var(--muted)">未设置</span><button class="btn s sm" type="button">录制</button></div></div>
<div class="cell"><div class="cap"><b>录制中</b><span>此时按 <span class="keys"><i>Esc</i></span> = 取消，不是把 Esc 设成快捷键。</span></div><div class="rec live"><span>按下想用的组合…</span><button class="btn s sm" type="button">取消</button></div></div>
<div class="cell"><div class="cap"><b>已设</b></div><div class="rec"><span class="keys"><i>⌃</i><i>⌥</i><i>T</i></span><span class="split" style="gap:4px"><button class="btn s sm" type="button">改</button><button class="btn s sm" type="button">清除</button></span></div></div>
<div class="cell"><div class="cap"><b>冲突</b><span>系统或别的 App 已经占了：不保存，留着上一个值。</span></div><div class="rec bad"><span class="keys"><i>⌘</i><i>⇧</i><i>4</i></span><span style="font-size:.8rem">被系统占用（截屏）</span></div></div>
<div class="cell"><div class="cap"><b>被拒绝的组合</b><span>只有 ⌥ 加字母 / 数字：这类组合在新系统上对沙盒 App 不稳，直接不让设，并说怎么改。</span></div><div class="rec bad"><span class="keys"><i>⌥</i><i>D</i></span><span style="font-size:.8rem">换一个带 ⌃ 或 ⌘ 的</span></div></div>
</div><p class="mini" style="margin:0">默认值：翻译 ⌃⌥T · 截图 ⌃⌥S · 输入翻译留空。「恢复默认」在块的右上角，一键回到这三个值。</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1320,"height":460}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
