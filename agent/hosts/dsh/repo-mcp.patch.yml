# One-shot overlay. Run dsh from the repository root so the relative
# launcher path resolves. Local stdio is the daily server.
# Remote MCP is published separately. This packaging stays stdio; do not add a url.
# This file does not declare tools.
- insert:
    - id: mcp-belliedmonkey
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: belliedmonkey
        transport: stdio
        command: node
        args: ["agent/hosts/dsh/stdio.js"]
