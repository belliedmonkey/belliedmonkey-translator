name: test

# Zero-dependency repo: there is nothing to install, so there is deliberately no
# `npm ci`, no lockfile restore and no cache step. If an install step ever shows
# up here, a dependency crept into package.json and that is the thing to fix.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The low number is the floor declared in package.json `engines`; 22 is what
        # `npm run test:layout` needs locally. Both must stay green, otherwise
        # the declared floor is a fiction.
        #
        # It became a fiction once: the floor sat at 16 while learn/chunk.js started
        # using `CompressionStream` and `Response`, both Node 18 globals. This row is
        # what caught it (34 red tests), so the fix was to raise the floor to the
        # truth — never to drop the row. A floor nothing runs at is just a comment.
        #
        # 2026-09-05 —— **同一件事又发生了一次，而且这一行又一次抓到了它。**
        # learn/chunk.js 用的是 `CompressionStream('deflate-raw')`，而 `deflate-raw`
        # 是 **Node 20** 才加的（Node 18 只有 gzip / deflate）。于是 main 的 CI
        # 从 2026-09-03 起连红，而没有人发现 —— **一条红着的 CI 等于没有 CI**，
        # 「合并前先 gh pr checks」那条纪律在那几天里是失效的。
        #
        # 修法照上面那句：抬到真相，不删这一行。产品那一侧不受影响 ——
        # deflate-raw 在 Chrome 103+ / Safari 16.4+ 都有，浏览器从来没有问题；
        # Node 18 是一个**产品从不运行的环境**，在那里绿不绿说明不了任何事。
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  build:
    name: build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: global
            cmd: node build.js
          - flavor: china
            cmd: node build.js --flavor china
          - flavor: firefox
            cmd: node build.js firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # build.js carries hard gates, not just packaging: the manifest
      # `data_collection_permissions` assertion (issue #53) and the china-flavor
      # compliance grep over dist-china/. A green build IS the gate here; the
      # zip it produces is a byproduct we throw away.
      - run: ${{ matrix.cmd }}

# Not covered here, on purpose:
#
#   npm run test:layout  — the 29-fixture layout corpus. It drives a real headless
#   Chrome over raw CDP and loads the extension via Extensions.loadUnpacked, which
#   is worth having in CI but is not wired up yet. Until it is, it stays a
#   mandatory LOCAL gate before any push touching extension/content/** or
#   extension/styles/** (docs/verification-spec.md §3.2) — CI being green does not
#   discharge it.
#
#   The 5-row device matrix (iPhone / iPad / macOS Safari / Chrome / Firefox via
#   cua-driver) cannot run on a GitHub runner at all. See docs/verification-spec.md §0.
